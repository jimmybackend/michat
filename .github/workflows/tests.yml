name: tests

# El hook de .githooks/pre-commit solo protege a quien lo activó a mano
# (git config core.hooksPath .githooks). Esto lo hace obligatorio: si alguien
# toca un ENUM y no actualiza chat/includes/Schema.php, el PR se pone rojo.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Se necesita el histórico para comparar finales de línea contra la
          # rama base. Con el checkout superficial por defecto no hay con qué.
          fetch-depth: 0

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # No hay composer.json: las dependencias viven en el servidor, fuera del
      # webroot. La suite solo ejercita funciones puras, así que no hace falta
      # instalar nada más.
      - name: Comprobar sintaxis de todo el PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Ejecutar la suite
        run: php tests/run.php

      - name: schema.sql no puede contener datos
        run: |
          inserts=$(grep -c '^INSERT INTO' schema.sql || true)
          if [ "$inserts" -ne 0 ]; then
            echo "schema.sql contiene $inserts INSERT INTO; es estructura únicamente." >&2
            exit 1
          fi

      # Un script de sustitución escrito en modo texto reescribe el archivo
      # entero con LF y convierte un cambio de 15 líneas en un diff de 600.
      # Ya pasó una vez con ocho archivos. Esto lo detecta antes de la revisión.
      - name: Los finales de línea no pueden cambiar respecto a la base
        run: bash .github/scripts/check-line-endings.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
